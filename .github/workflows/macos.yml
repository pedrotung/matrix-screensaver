name: Build macOS screensaver

on:
  push:
    branches: [main]
    paths: ["macos/**", "core/**", ".github/workflows/macos.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build MatrixRain.saver
        run: sh macos/build.sh
      - name: Check the bundle
        run: |
          file macos/build/MatrixRain.saver/Contents/MacOS/MatrixRain
          codesign --verify --verbose macos/build/MatrixRain.saver
      - uses: actions/upload-artifact@v4
        with:
          name: MatrixRain-macos
          path: macos/build/MatrixRain-macos.zip
      # Keep a ready-to-download copy in download/ (that folder does not trigger this workflow).
      - name: Commit the build to download/
        run: |
          cp macos/build/MatrixRain-macos.zip download/MatrixRain-macos.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/MatrixRain-macos.zip
          git commit -m "Update macOS build from ${GITHUB_SHA::7}" || exit 0
          git push
